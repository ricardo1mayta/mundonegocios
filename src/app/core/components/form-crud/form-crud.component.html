<div class="prime-crud-page">
  <div class="text-2xl font-medium text-gray-800 dark:text-white/90">{{ titulo() }}</div>

  <p-card styleClass="prime-crud-filter-card">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="pi pi-filter text-sm text-gray-600 dark:text-gray-300"></i>
        <div class="text-xl font-medium text-gray-800 dark:text-white/90">{{ tituloFiltros() }}</div>
      </div>
      <p-button
        type="button"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        [icon]="mostrarFiltros() ? 'pi pi-angle-double-up' : 'pi pi-angle-double-down'"
        ariaLabel="Alternar filtros"
        (onClick)="mostrarFiltros.set(!mostrarFiltros())"
      ></p-button>
    </div>
    <div [ngClass]="{ hidden: !mostrarFiltros() }" class="mt-4">
      <ng-content select="[filtros]" />
    </div>
  </p-card>

  <div class="flex flex-col flex-grow">
    <div class="flex flex-col">
      @if (mensajeAdvertencia()) {
        <div class="text-sm text-red-600">
          {{ mensajeAdvertencia() }}
        </div>
      }
    </div>
    <ng-content />
  </div>
</div>
