<div class="flex flex-col gap-4">
  <div class="text-2xl font-medium text-gray-800 dark:text-white/90">{{ titulo() }}</div>
  <div class="flex flex-col rounded-lg px-8 py-4 bg-white dark:bg-gray-900">
    <div class="flex justify-between items-center">
      <div class="flex items-center">
        <mat-icon class="text-sm text-gray-600 dark:text-gray-300">filter_list</mat-icon>
        <div class="text-xl font-medium text-gray-800 dark:text-white/90">{{ tituloFiltros() }}</div>
      </div>
      <button mat-icon-button (click)="mostrarFiltros.set(!mostrarFiltros())" class="text-gray-600 dark:text-gray-300">
        <mat-icon class="text-inherit">
          {{ mostrarFiltros() ? "keyboard_double_arrow_up" : "keyboard_double_arrow_down" }}
        </mat-icon>
      </button>
    </div>
    <div [ngClass]="{ hidden: !mostrarFiltros() }">
      <ng-content select="[filtros]" />
    </div>
  </div>

  <div class="flex flex-col flex-grow">
    <div class="flex flex-col">
      @if (mensajeAdvertencia()) {
        <div class="text-sm text-red-600">
          {{ mensajeAdvertencia() }}
        </div>
      }
    </div>
    <ng-content />
  </div>
</div>
