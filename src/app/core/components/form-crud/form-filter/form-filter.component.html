<form [formGroup]="formGroup()" class="flex flex-col">
  <ng-content />
</form>

@if (mostrarEstado()) {
  <div class="flex flex-col">
    <div class="font-medium">{{ tituloEstado() }}</div>
    <div class="flex gap-x-4">
      <mat-checkbox [formControl]="checkActivo" (change)="checkChange(1)">{{ etiquetaActivo() }}</mat-checkbox>
      <mat-checkbox [formControl]="checkInactivo" (change)="checkChange(2)">{{ etiquetaInactivo() }}</mat-checkbox>
    </div>
  </div>
}

<div class="flex justify-center mt-3 gap-3 flex-col sm:flex-row">
  <!-- Limpiar (secondary) -->
  <button
    mat-stroked-button
    type="button"
    (click)="limpiarClick()"
    class="w-full sm:w-auto !h-10 !px-5 !rounded-xl !normal-case !border-slate-300 !text-slate-700 hover:!bg-slate-50 dark:!border-white/10 dark:!text-slate-200 dark:hover:!bg-white/5"
  >
    <mat-icon class="!text-[20px] !mr-2 !text-slate-500 dark:!text-slate-300"> cleaning_services </mat-icon>
    Limpiar
  </button>

  <!-- Buscar (primary brand) -->
  <button
    mat-flat-button
    type="button"
    (click)="buscarClick()"
    class="w-full sm:w-auto !h-10 !px-5 !rounded-xl !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
  >
    <mat-icon class="!text-[20px] !mr-2 !text-white dark:!text-slate-900">search</mat-icon>
    Buscar
  </button>
</div>
