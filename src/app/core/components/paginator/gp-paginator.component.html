<div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <!-- izquierda: page size -->
  <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200 dark:text-gray-300">
    <span class="whitespace-nowrap">Registros por página:</span>

    <select
      class="h-9 rounded-xl border border-gray-300/40 bg-white px-3 text-sm text-gray-800 shadow-sm focus:outline-none focus:border-blue-500/60 focus:ring-2 focus:ring-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed dark:border-gray-700/50 dark:bg-gray-900 dark:text-gray-100 dark:text-white/90"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeChange($event)"
      [disabled]="loading"
    >
      <option *ngFor="let opt of pageSizeOptions" [value]="opt">{{ opt }}</option>
    </select>
  </div>

  <!-- derecha: rango + botones -->
  <div class="flex items-center justify-between gap-3 sm:justify-end">
    <span class="text-sm text-gray-700 dark:text-gray-200 dark:text-gray-300"> {{ from() }} - {{ to() }} de {{ length }} </span>

    <div class="flex items-center gap-1">
      <button *ngIf="showFirstLastButtons" ... (click)="first()" [disabled]="!canPrev()">«</button>

      <button
        type="button"
        class="h-9 w-9 rounded-xl border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-40 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:bg-gray-800 dark:text-gray-300 dark:border-gray-800"
        (click)="prev()"
        [disabled]="!canPrev()"
        aria-label="Anterior"
      >
        ‹
      </button>

      <button
        type="button"
        class="h-9 w-9 rounded-xl border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-40 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:bg-gray-800 dark:text-gray-300 dark:border-gray-800"
        (click)="next()"
        [disabled]="!canNext()"
        aria-label="Siguiente"
      >
        ›
      </button>

      <button
        *ngIf="showFirstLastButtons"
        type="button"
        class="h-9 w-9 rounded-xl border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-40 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:bg-gray-800 dark:text-gray-300 dark:border-gray-800"
        (click)="last()"
        [disabled]="!canNext()"
        aria-label="Última"
      >
        »
      </button>
    </div>
  </div>
</div>
