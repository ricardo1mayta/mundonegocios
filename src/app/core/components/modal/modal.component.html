<div class="bg-red-700 text-white flex justify-between items-center p-4">
  <h2 class="text-lg font-semibold">{{ data.titulo }}</h2>
  <p-button
    type="button"
    icon="pi pi-times"
    [text]="true"
    [rounded]="true"
    severity="secondary"
    ariaLabel="Cerrar"
  ></p-button>
</div>
<div class="px-6 py-4">
  <div class="flex flex-col gap-4">
    <div class="flex justify-center">
      <i [class]="iconClass() + ' text-7xl'"></i>
    </div>
    <div [innerHTML]="data.mensaje"></div>
  </div>
</div>
<div class="prime-dialog-footer !justify-center px-6 pb-4">
  @if (mostrarAceptar()) {
    <p-button type="button" [label]="textoAceptar()" cdkFocusInitial></p-button>
  }
  @if (mostrarNo()) {
    <p-button type="button" [label]="textoNo()" severity="secondary" [outlined]="true"></p-button>
  }
  @if (mostrarCancelar()) {
    <p-button type="button" [label]="textoCancelar()" severity="secondary" [outlined]="true"></p-button>
  }
</div>
