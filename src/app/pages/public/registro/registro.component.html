<div class="relative min-h-screen flex items-center justify-center overflow-hidden bg-gradient-to-br from-[#0a1224] via-[#08192e] to-[#031325]">
  <div class="absolute -top-32 -left-24 w-96 h-96 rounded-full bg-[#2563eb]/30 blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-80 h-80 rounded-full bg-[#0ea5e9]/30 blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-sm sm:max-w-md backdrop-blur-lg bg-white/5 border border-white/15 rounded-2xl shadow-[0_0_40px_#0284c733] p-8 sm:p-10 text-white">
    <div class="flex justify-center mb-4">
      <svg class="w-12 h-12 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z" />
      </svg>
    </div>
    <h2 class="text-center text-2xl sm:text-3xl font-semibold mb-8">Crear cuenta</h2>

    <form class="space-y-5">
      <div class="space-y-1">
        <label for="nombre" class="text-sm font-medium text-white/80">Nombre completo</label>
        <input
          id="nombre"
          type="text"
          placeholder="Ingresa tu nombre"
          class="w-full py-2 px-3 rounded-lg bg-white/10 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div class="space-y-1">
        <label for="email" class="text-sm font-medium text-white/80">Correo electrónico</label>
        <input
          id="email"
          type="email"
          placeholder="tu@email.com"
          class="w-full py-2 px-3 rounded-lg bg-white/10 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div class="space-y-1">
        <label for="password" class="text-sm font-medium text-white/80">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="********"
          class="w-full py-2 px-3 rounded-lg bg-white/10 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <button
        type="button"
        class="w-full py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-blue-600 hover:to-cyan-500 transition-colors">
        Crear cuenta
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-white/70">
      Â¿Ya tienes cuenta?
      <a routerLink="/login" class="text-cyan-300 hover:text-white">Inicia sesión</a>
    </p>
  </div>
</div>
