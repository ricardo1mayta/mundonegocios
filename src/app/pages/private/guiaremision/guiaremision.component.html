<app-form-crud titulo="Guias de remision">
  <!-- FILTROS ------------------------------------------------------------ -->
  <div filtros class="text-gray-800 dark:text-white/90">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="text-sm font-semibold text-gray-800 dark:text-white/90">Guia de remision</div>
        <div class="text-xs text-gray-500 dark:text-gray-400">Administra y consulta tus guias emitidas</div>
      </div>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-3 py-2 text-xs font-semibold text-white shadow-theme-xs hover:bg-brand-600"
        (click)="crearPedido()"
      >
        <i class="!text-[18px]" class="pi pi-plus"></i>
        Nueva guia
      </button>
    </div>

    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3">
        <!-- Buscador -->
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Buscador</label>
          <p-datepicker inputId="buscador" formControlName="buscador" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>

        <!-- Fecha hasta -->
        <div class="self-end flex flex-col">
          <label for="fechaHasta" class="sr-only">Hasta</label>
          <p-datepicker inputId="fechaHasta" formControlName="fechaHasta" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>

        <div class="flex items-end">
          <button
            type="button"
            class="inline-flex h-10 items-center justify-center rounded-lg bg-gray-900 px-4 text-xs font-semibold text-white shadow-theme-xs hover:bg-gray-800 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-100"
            (click)="aplicarFiltros()"
          >
            Buscar
          </button>
        </div>
      </div>
    </app-form-filter>
  </div>

  <div class="rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list
      class="flex flex-col flex-auto p-4"
      etiquetaAgregar="Crear"
      (agregarClick)="crearPedido()"
      nombreExcel="Guias de remision"
      [configuracionExcel]="configuracionExcel"
    >
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="Ticket" propiedad="id">
          <ng-template let-id="valor">
            <div class="flex items-center gap-2">
              <button
                type="button"
                class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-rose-600 hover:bg-rose-50 dark:border-gray-800 dark:hover:bg-rose-500/10"
                (click)="viewPdf(id)"
                title="Ver PDF"
                aria-label="Ver PDF"
              >
                <i class="!text-[18px]" class="pi pi-file-pdf"></i>
              </button>
              <button
                type="button"
                class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-gray-800/50"
                (click)="downloadPdf(id)"
                title="Descargar PDF"
                aria-label="Descargar PDF"
              >
                <i class="!text-[18px]" class="pi pi-download"></i>
              </button>
            </div>
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Serie" propiedad="serie" />
        <app-columna-tabla titulo="Correlativo" propiedad="correlativo" />
        <app-columna-tabla titulo="Fecha Emision" propiedad="fechaEmision">
          <ng-template let-fechaEmision="valor">
            {{ fechaEmision | date: "dd/MM/yyyy HH:mm" }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Cliente ID" propiedad="clienteDestinoId" />

        <app-columna-tabla titulo="Estado" propiedad="estado">
          <ng-template let-estado="valor">
            <span
              class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold"
              [ngClass]="{
                'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300':
                  estado === 1 || estado === 'Activo' || estado === 'ACTIVO',
                'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300':
                  estado === 2 || estado === 'Pendiente' || estado === 'PENDIENTE',
                'bg-rose-50 text-rose-700 dark:bg-rose-500/10 dark:text-rose-300':
                  estado === 0 || estado === 3 || estado === 'Anulado' || estado === 'ANULADO',
              }"
            >
              {{
                estado === 1
                  ? "Activo"
                  : estado === 2
                    ? "Pendiente"
                    : estado === 0 || estado === 3
                      ? "Anulado"
                      : estado || "ï¿½"
              }}
            </span>
          </ng-template>
        </app-columna-tabla>

        <app-accion-tabla etiqueta="Ver" icono="visibility" />
        <app-accion-tabla etiqueta="Editar" icono="edit" (accion)="editarPedido($event.datos)" />
        <app-accion-tabla etiqueta="Generar Pedido" icono="receipt" (accion)="generarPedido($event.datos)" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
