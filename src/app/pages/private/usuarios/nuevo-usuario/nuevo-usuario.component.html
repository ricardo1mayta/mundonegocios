<div class="modal-surface">
  <button mat-icon-button mat-dialog-close class="hover:bg-blue-900/40 rounded-full p-1">
    <mat-icon>close</mat-icon>
  </button>
  <div class="px-2 pr-14 mb-6">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Usuario</h2>
  </div>

  <!-- WIZARD -->
  <mat-dialog-content class="max-h-[80vh] overflow-y-auto p-0">
  <mat-horizontal-stepper #stepper linear>
    <!-- Paso 1 -->
    <mat-step [stepControl]="personalesForm" label="Datos personales">
      <form [formGroup]="personalesForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
        <div>
          <label class="label dark:text-white/90">Username</label>
          <input formControlName="username" class="input md:max-w-[240px]" />
        </div>

        <div>
          <label class="label dark:text-white/90">Correo</label>
          <input formControlName="emailUser" class="input md:max-w-[240px]" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Nombres</label>
          <input formControlName="nombres" class="input" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Apellidos</label>
          <input formControlName="apellidos" class="input" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">URL imagen (avatar)</label>
          <input formControlName="img" class="input" />
        </div>

        <div class="col-span-full flex justify-end pt-4">
          <button mat-button matStepperNext [disabled]="personalesForm.invalid">Siguiente</button>
        </div>
      </form>
    </mat-step>

    <!-- Paso 2 -->
    <mat-step [stepControl]="configForm" label="Config & Roles">
      <form [formGroup]="configForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
        <div>
          <label class="label dark:text-white/90">Activo</label>
          <mat-slide-toggle formControlName="activo"></mat-slide-toggle>
        </div>

        <div>
          <label class="label dark:text-white/90">Tipo usuario</label>
          <input formControlName="tipoUser" class="input md:max-w-[240px]" />
        </div>

        <div>
          <label class="label dark:text-white/90">Código tipo</label>
          <input type="number" formControlName="idcodTipoUser" class="input md:max-w-[240px]" />
        </div>

        <div>
          <label class="label dark:text-white/90">Sede</label>
          <mat-select formControlName="idSede" class="input">
            <mat-option *ngFor="let s of sedes" [value]="s.id">{{ s.nombresede }}</mat-option>
          </mat-select>
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Roles</label>
          <mat-select formControlName="rolesIds" multiple class="input">
            <mat-option *ngFor="let r of roles" [value]="r.idRol">{{ r.nombreRol }}</mat-option>
          </mat-select>
        </div>

        <div class="col-span-full flex justify-between pt-4">
          <button mat-button matStepperPrevious>Volver</button>
          <button mat-flat-button color="primary" [disabled]="configForm.invalid" (click)="guardar()">Guardar</button>
        </div>
      </form>
    </mat-step>
  </mat-horizontal-stepper>
  </mat-dialog-content>
</div>
