<div class="modal-surface">
  <button
    class="!absolute !right-4 !top-4 !z-[9999] !rounded-lg hover:!bg-gray-100 dark:hover:!bg-white/5"
  >
    <i class="!text-gray-500 dark:!text-gray-400" class="pi pi-times"></i>
  </button>
  <div class="px-2 pr-14 mb-6">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Usuario</h2>
  </div>

  <!-- WIZARD -->
  <div class="max-h-[80vh] overflow-y-auto p-0">
    <p-stepper [value]="1" class="w-full">
      <p-step-list>
        <p-step [value]="1">Datos personales</p-step>
        <p-step [value]="2">Config & Roles</p-step>
      </p-step-list>
      <p-step-panels>
      <!-- Paso 1 -->
      <p-step-panel [value]="1"><ng-template #content let-activateCallback="activateCallback">
        <form [formGroup]="personalesForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
          <div>
            <label class="label dark:text-white/90">Username</label>
            <input formControlName="username" class="input md:max-w-[240px]" />
          </div>

          <div>
            <label class="label dark:text-white/90">Correo</label>
            <input formControlName="emailUser" class="input md:max-w-[240px]" />
          </div>

          <div>
            <label class="label dark:text-white/90">Contrasena</label>
            <input type="password" formControlName="password" class="input md:max-w-[240px]" />
          </div>

          <div class="md:col-span-2">
            <label class="label dark:text-white/90">Nombres</label>
            <input formControlName="nombres" class="input" />
          </div>

          <div class="md:col-span-2">
            <label class="label dark:text-white/90">Apellidos</label>
            <input formControlName="apellidos" class="input" />
          </div>

          <div class="md:col-span-2">
            <label class="label dark:text-white/90">URL imagen (avatar)</label>
            <input formControlName="img" class="input" />
          </div>

          <div class="col-span-full flex justify-end gap-2 pt-2">
            <button
              (click)="activateCallback(2)"
              [disabled]="personalesForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Siguiente
            </button>
          </div>
        </form>
      </ng-template></p-step-panel>

      <!-- Paso 2 -->
      <p-step-panel [value]="2"><ng-template #content let-activateCallback="activateCallback">
        <form [formGroup]="configForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
          <div>
            <label class="label dark:text-white/90">Activo</label>
            <app-switch
              label=""
              [defaultChecked]="!!configForm.get('activo')?.value"
              (valueChange)="configForm.get('activo')?.setValue($event)"
            ></app-switch>
          </div>

          <div>
            <label class="label dark:text-white/90">Tipo usuario</label>
            <input formControlName="tipoUser" class="input md:max-w-[240px]" />
          </div>

          <div>
            <label class="label dark:text-white/90">Codigo tipo</label>
            <input type="number" formControlName="idcodTipoUser" class="input md:max-w-[240px]" />
          </div>

          <div>
            <label class="label dark:text-white/90">Sede</label>
            <p-select formControlName="idSede" [options]="sedes" optionLabel="nombresede" optionValue="id" appendTo="body" styleClass="prime-form-input"></p-select>
          </div>

          <div class="md:col-span-2">
            <label class="label dark:text-white/90">Roles</label>
            <p-multiselect formControlName="rolesIds" [options]="roles" optionLabel="nombreRol" optionValue="idRol" appendTo="body" styleClass="prime-form-input"></p-multiselect>
          </div>

          <div class="col-span-full flex justify-between gap-2 pt-2">
            <button
              (click)="activateCallback(1)"
              class="!h-10 !rounded-xl !px-5 !normal-case !border-slate-300 !text-slate-700 hover:!bg-slate-50 dark:!border-white/10 dark:!text-slate-200 dark:hover:!bg-white/5"
            >
              Volver
            </button>
            <button
              [disabled]="configForm.invalid"
              (click)="guardar()"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Guardar
            </button>
          </div>
        </form>
      </ng-template></p-step-panel>
    </p-step-panels></p-stepper>
  </div>
</div>
