<app-form-crud titulo="Compras">
  <!-- FILTROS ------------------------------------------------------------ -->
  <div filtros>
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!--?Buscador -->
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 dark:text-white/90">Buscador</label>
          <p-datepicker inputId="buscador" formControlName="buscador" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>

        <!--?Fecha hasta -->
        <div class="self-end flex flex-col">
          <label for="fechaHasta" class="sr-only">Hasta</label>
          <p-datepicker inputId="fechaHasta" formControlName="fechaHasta" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>
      </div>
    </app-form-filter>
  </div>
  <div class="rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list
      class="flex flex-col flex-auto p-4"
      etiquetaAgregar="Crear"
      (agregarClick)="crearPedido()"
      nombreExcel="Clientes API Keys"
      [configuracionExcel]="configuracionExcel"
    >
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="Serie" propiedad="serie" />
        <app-columna-tabla titulo="Fecha Crea" propiedad="fechaCrea">
          <ng-template let-fechaCrea="valor">
            {{ fechaCrea | date: "dd/MM/yyyy" }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Proveedor" propiedad="provedor">
          <ng-template let-proveedor="valor">
            {{ proveedor?.nombre | uppercase }}
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Doc. Proveedor" propiedad="numeroDocumento" />
        <app-columna-tabla titulo="Total" propiedad="total" />
        <app-columna-tabla titulo="Status" propiedad="status">
          <ng-template let-status="valor">
            <i [ngClass]="status ? 'pi pi-check-circle text-green-600' : 'pi pi-times-circle text-red-600'"></i>
          </ng-template>
        </app-columna-tabla>

        <app-accion-tabla etiqueta="Ver" icono="visibility" (accion)="verCompra($event.datos)" />
        <app-accion-tabla etiqueta="IMEIs" icono="qr_code_2" (accion)="registrarImeis($event.datos)" />
        <app-accion-tabla (accion)="editarCompra($event.datos)" etiqueta="Editar" icono="edit" />
        <app-accion-tabla etiqueta="Anular" icono="delete" (accion)="anularCompra($event.datos)" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
