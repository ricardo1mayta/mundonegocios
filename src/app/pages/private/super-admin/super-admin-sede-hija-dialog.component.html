<div class="modal-surface bg-white dark:bg-gray-900 dark:border-gray-800 dark:text-white/90">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">
      {{ esNuevo ? "Nueva sede hija" : "Editar sede hija" }}
    </h2>
    <button class="text-gray-500 hover:text-gray-700 dark:text-gray-300">X</button>
  </div>

  <div class="grid gap-3 sm:grid-cols-2">
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      RUC
      <input class="input mt-1" [(ngModel)]="sede.ruc" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Tipo Doc
      <input class="input mt-1" [(ngModel)]="sede.tipoDoc" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Nombre comercial
      <input class="input mt-1" [(ngModel)]="sede.nomComercial" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Razón social
      <input class="input mt-1" [(ngModel)]="sede.razonSocial" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200 sm:col-span-2">
      Dirección
      <input class="input mt-1" [(ngModel)]="sede.direccion" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Teléfono
      <input class="input mt-1" [(ngModel)]="sede.telefono" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Código ubigeo
      <input class="input mt-1" [(ngModel)]="sede.codigoUbigeo" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Nombre sede
      <input class="input mt-1" [(ngModel)]="sede.nombresede" />
    </label>
    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
      <input type="checkbox" [(ngModel)]="sede.status" />
      Activo
    </label>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <button
      class="inline-flex items-center justify-center gap-2 rounded-lg transition px-4 py-2 text-sm bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700"
    >
      Cancelar
    </button>
    <button
      (click)="guardar()"
      class="inline-flex items-center justify-center gap-2 rounded-lg transition px-4 py-2 text-sm bg-brand-500 text-white shadow-theme-xs hover:bg-brand-600"
    >
      {{ esNuevo ? "Crear" : "Guardar" }}
    </button>
  </div>
</div>
