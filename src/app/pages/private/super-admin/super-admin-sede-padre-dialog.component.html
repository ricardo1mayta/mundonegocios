<div class="modal-surface bg-white dark:bg-gray-900 dark:border-gray-800 dark:text-white/90">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">Editar sede padre</h2>
    <p-button type="button" icon="pi pi-times" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Cerrar"></p-button>
  </div>

  <div class="grid gap-3 sm:grid-cols-2">
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200 sm:col-span-2">
      Nombre
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="sede.nombressede" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200 sm:col-span-2">
      Correo
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="sede.correo" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200 sm:col-span-2">
      Contrasena
      <input pInputText class="prime-form-input mt-1" type="password" [(ngModel)]="sede.clave" />
    </label>
  </div>

  <div class="prime-dialog-footer mt-6">
    <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true"></p-button>
    <p-button type="button" label="Guardar" (onClick)="guardar()"></p-button>
  </div>
</div>
