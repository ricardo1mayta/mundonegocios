<div class="modal-surface bg-white dark:bg-gray-900 dark:border-gray-800 dark:text-white/90">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">
      {{ esNuevo ? "Nuevo usuario" : "Editar usuario" }}
    </h2>
    <p-button type="button" icon="pi pi-times" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Cerrar"></p-button>
  </div>

  <div class="grid gap-3 sm:grid-cols-2">
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Username
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="usuario.username" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Password
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="usuario.password" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Correo
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="usuario.emailUser" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Apellidos
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="usuario.apellidos" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Tipo usuario
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="usuario.tipoUser" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200">
      Id Tipo User
      <input pInputText class="prime-form-input mt-1" [(ngModel)]="usuario.idcodTipoUser" />
    </label>
    <label class="flex flex-col text-sm text-gray-700 dark:text-gray-200 sm:col-span-2">
      Roles
      <p-multiselect
        [options]="roles"
        optionLabel="nombreRol"
        optionValue="idRol"
        [(ngModel)]="usuario.rolesIds"
        [ngModelOptions]="{ standalone: true }"
        display="chip"
        styleClass="prime-form-input mt-1"
      ></p-multiselect>
    </label>
    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200 sm:col-span-2">
      <p-checkbox [binary]="true" [(ngModel)]="usuario.activo"></p-checkbox>
      Activo
    </label>
  </div>

  <div class="prime-dialog-footer mt-6">
    <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true"></p-button>
    <p-button type="button" [label]="esNuevo ? 'Crear' : 'Guardar'" (onClick)="guardar()"></p-button>
  </div>
</div>
