<div class="min-h-screen bg-gray-100 p-4 text-gray-800 dark:bg-gray-800 dark:text-white/90">
  <h1 class="mb-4 text-2xl font-bold">Gestion de Menu por Rol</h1>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    <section class="rounded-lg bg-white p-4 shadow dark:bg-gray-900 lg:col-span-1">
      <h2 class="mb-3 text-lg font-semibold">Roles</h2>

      <div class="space-y-2" *ngIf="roles().length; else noRolesTpl">
        <div
          *ngFor="let rol of roles()"
          class="role-card flex items-center justify-between rounded-md border border-gray-200 px-3 py-2 dark:border-gray-700"
          [class.border-blue-500]="isRolSeleccionado(rol.idRol)"
        >
          <div>
            <p class="font-medium">{{ rol.descripcionRol || rol.nombreRol }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">ID: {{ rol.idRol }}</p>
          </div>
          <button
            class="role-action-btn"
            [class.role-action-btn--active]="isRolSeleccionado(rol.idRol)"
            color="primary"
            type="button"
            (click)="seleccionarRol(rol.idRol)"
          >
            Marcar menu
          </button>
        </div>
      </div>

      <ng-template #noRolesTpl>
        <p class="text-sm text-gray-500 dark:text-gray-400">No hay roles para mostrar.</p>
      </ng-template>
    </section>

    <section class="rounded-lg bg-white p-4 shadow dark:bg-gray-900 lg:col-span-2">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-lg font-semibold">Menus del rol</h2>
        <span class="text-sm text-gray-500 dark:text-gray-400" *ngIf="selectedRol() as rol">
          Rol activo: {{ rol.descripcionRol || rol.nombreRol }}
        </span>
      </div>

      <div *ngIf="!selectedRolId()" class="rounded-md bg-gray-50 p-3 text-sm text-gray-500 dark:bg-gray-800 dark:text-gray-400">
        Selecciona un rol y pulsa "Marcar menu" para cargar y marcar sus menus.
      </div>

      <div class="rounded-lg bg-gray-50 p-4 dark:bg-gray-800" [class.opacity-60]="!selectedRolId()">
        <div class="space-y-1">
          <ng-container *ngTemplateOutlet="menuNodesTpl; context: { $implicit: dataSource(), level: 0 }"></ng-container>
        </div>
        <ng-template #menuNodesTpl let-nodes let-level="level">
          <div *ngFor="let node of nodes" class="space-y-1">
            <div class="flex items-center rounded px-2 py-1 transition hover:bg-gray-100 dark:hover:bg-white/5" [style.padding-left.px]="level * 18">
              <span class="tree-placeholder-btn" *ngIf="!node.children?.length"></span>
              <i *ngIf="node.children?.length" class="pi pi-chevron-down mr-2 text-xs text-gray-500"></i>
              <p-checkbox
                class="mr-2"
                [binary]="true"
                [ngModel]="checklist.isSelected(node)"
                [disabled]="!selectedRolId()"
                (onChange)="onLeafToggle(node, $event.checked)"
              ></p-checkbox>
              <span [class.font-semibold]="node.children?.length" [class.text-blue-700]="node.children?.length" class="font-medium text-gray-700 dark:text-gray-200 dark:text-blue-300">{{ node.name }}</span>
            </div>
            <ng-container *ngIf="node.children?.length" [ngTemplateOutlet]="menuNodesTpl" [ngTemplateOutletContext]="{ $implicit: node.children, level: level + 1 }"></ng-container>
          </div>
        </ng-template>
      </div>
    </section>
  </div>
</div>
