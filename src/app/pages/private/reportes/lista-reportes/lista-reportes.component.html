<section class="grid grid-cols-1 md:grid-cols-3 gap-3">
  <!-- KPI 1 -->
  <button
    type="button"
    (click)="selectKpi('ventas')"
    [class.bg-emerald-50]="selectedKpi() === 'ventas'"
    [class.bg-neutral-100]="selectedKpi() !== 'ventas'"
    class="text-left bg-neutral-100 p-4 rounded-xl w-full">
    <div
      class="bg-neutral-100 p-4 rounded-xl w-full"
      [class.ring-2]="selectedKpi() === 'ventas'"
      [class.ring-emerald-400]="selectedKpi() === 'ventas'"
      [class.shadow-lg]="selectedKpi() === 'ventas'"
      [class.opacity-90]="selectedKpi() !== 'ventas'">
      <div class="relative overflow-hidden rounded-2xl bg-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition w-full">
        <div class="pointer-events-none absolute -top-20 -right-24 h-48 w-48 rounded-full bg-emerald-400/15 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-20 -left-24 h-48 w-48 rounded-full bg-indigo-400/10 blur-3xl"></div>

        <div class="relative rounded-2xl border border-slate-200/70 bg-white p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">KPI</div>
              <div class="text-sm font-semibold text-slate-900">Monto Mercadería</div>
            </div>

            <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-semibold text-emerald-700 ring-1 ring-emerald-200">
              <span class="inline-block h-2 w-2 rounded-full bg-emerald-500"></span>
              Fecha
            </span>
          </div>

          <div class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900">VENTAS</div>

          <div class="mt-2 text-[12px] text-slate-500">Venta entre fechas</div>

          <div class="mt-3 h-1.5 w-full rounded-full bg-slate-100 overflow-hidden">
            <div class="h-full w-2/3 bg-gradient-to-r from-emerald-400 to-emerald-600"></div>
          </div>
        </div>
      </div>
    </div>
  </button>

  <!-- KPI 2 (igual, solo cambia texto/valor) -->
  <button
    type="button"
    (click)="selectKpi('compras')"
    class="text-left bg-neutral-100 p-4 rounded-xl w-full"
    [class.bg-emerald-50]="selectedKpi() === 'compras'"
    [class.bg-neutral-100]="selectedKpi() !== 'compras'">
    <div
      class="bg-neutral-100 p-4 rounded-xl w-full"
      [class.ring-2]="selectedKpi() === 'compras'"
      [class.ring-emerald-400]="selectedKpi() === 'compras'"
      [class.shadow-lg]="selectedKpi() === 'compras'"
      [class.opacity-90]="selectedKpi() !== 'compras'">
      <div class="relative overflow-hidden rounded-2xl bg-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition w-full">
        <div class="pointer-events-none absolute -top-20 -right-24 h-48 w-48 rounded-full bg-emerald-400/15 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-20 -left-24 h-48 w-48 rounded-full bg-indigo-400/10 blur-3xl"></div>

        <div class="relative rounded-2xl border border-slate-200/70 bg-white p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">KPI</div>
              <div class="text-sm font-semibold text-slate-900">Monto Mercadería</div>
            </div>

            <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-semibold text-emerald-700 ring-1 ring-emerald-200">
              <span class="inline-block h-2 w-2 rounded-full bg-emerald-500"></span>
              Fecha
            </span>
          </div>

          <div class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900">COMPRAS</div>

          <div class="mt-2 text-[12px] text-slate-500">Compra entre fechas</div>

          <div class="mt-3 h-1.5 w-full rounded-full bg-slate-100 overflow-hidden">
            <div class="h-full w-2/3 bg-gradient-to-r from-emerald-400 to-emerald-600"></div>
          </div>
        </div>
      </div>
    </div>
  </button>
  <button type="button" class="text-left bg-neutral-100 p-4 rounded-xl w-full">
    <div class="bg-neutral-100 p-4 rounded-xl w-full">
      <div class="relative overflow-hidden rounded-2xl bg-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition w-full">
        <div class="pointer-events-none absolute -top-20 -right-24 h-48 w-48 rounded-full bg-emerald-400/15 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-20 -left-24 h-48 w-48 rounded-full bg-indigo-400/10 blur-3xl"></div>

        <div class="relative rounded-2xl border border-slate-200/70 bg-white p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">KPI</div>
              <div class="text-sm font-semibold text-slate-900">Monto Mercadería</div>
            </div>

            <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-semibold text-emerald-700 ring-1 ring-emerald-200">
              <span class="inline-block h-2 w-2 rounded-full bg-emerald-500"></span>
              Stock
            </span>
          </div>

          <div class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900">
            {{ montoTotalMercaderia() | number: "1.2-2" }}
          </div>

          <div class="mt-2 text-[12px] text-slate-500">Stock disponible por lote</div>

          <div class="mt-3 h-1.5 w-full rounded-full bg-slate-100 overflow-hidden">
            <div class="h-full w-2/3 bg-gradient-to-r from-emerald-400 to-emerald-600"></div>
          </div>
        </div>
      </div>
    </div>
  </button>
</section>
<!-- DETALLE ABAJO -->
<section id="kpi-detalle" class="mt-6 rounded-2xl bg-white p-5">
  @switch (selectedKpi()) {
    @case ("ventas") {
      <app-ventas-producto-detallado></app-ventas-producto-detallado>
    }
    @case ("compras") {
      <app-compras-producto-detallado></app-compras-producto-detallado>
    }
  }
</section>
