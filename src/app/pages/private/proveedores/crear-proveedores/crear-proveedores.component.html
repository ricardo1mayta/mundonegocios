<div class="modal-surface">
  <button
    mat-icon-button
    mat-dialog-close
    class="!absolute !right-4 !top-4 !z-[9999] !rounded-lg hover:!bg-gray-100 dark:hover:!bg-white/5"
  >
    <mat-icon class="!text-gray-500 dark:!text-gray-400">close</mat-icon>
  </button>
  <div class="px-2 pr-14 mb-6">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Proveedor</h2>
  </div>

  <!-- STEPPER -->
  <mat-dialog-content class="max-h-[85vh] overflow-y-auto p-0">
    <mat-horizontal-stepper linear>
      <!-- 1. Documento -->
      <mat-step [stepControl]="docForm" label="Documento">
        <form [formGroup]="docForm" class="space-y-4 py-4">
          <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
            <label class="flex flex-col md:col-span-2 dark:text-white/90">
              <span class="mb-1">Tipo doc.</span>
              <select formControlName="tipodocumento" class="input">
                <option *ngFor="let t of tiposDocumento()" [value]="t.id">{{ t.desc }}</option>
              </select>
            </label>

            <label class="flex flex-col md:col-span-2 relative dark:text-white/90">
              <span class="mb-1">Nº doc.</span>
              <input formControlName="numerodocumento" class="input pr-10" (keydown.enter)="buscarEnSunat()" />
              <button
                type="button"
                (click)="buscarEnSunat()"
                class="absolute right-2 top-7 text-blue-600 hover:text-blue-800"
              >
                <mat-icon>search</mat-icon>
              </button>
            </label>

            <label class="flex flex-col md:col-span-2 dark:text-white/90">
              <span class="mb-1">Razón social *</span>
              <input formControlName="nombre" class="input" />
            </label>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button
              mat-flat-button
              matStepperNext
              [disabled]="docForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Siguiente
            </button>
          </div>
        </form>
      </mat-step>

      <!-- 2. Dirección -->
      <mat-step [stepControl]="dirForm" label="Dirección">
        <form [formGroup]="dirForm" class="space-y-4 py-4">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <label class="flex flex-col md:col-span-2 dark:text-white/90">
              <span class="mb-1">Ciudad</span>
              <input formControlName="ciudad" class="input" />
            </label>
            <label class="flex flex-col md:col-span-3 dark:text-white/90">
              <span class="mb-1">Dirección *</span>
              <input formControlName="direccion" class="input" />
            </label>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <label class="flex flex-col dark:text-white/90">
              <span class="mb-1">Dpto</span>
              <select formControlName="departamento" class="input">
                <option value="" disabled selected>Departamento</option>
                <option *ngFor="let d of departamentos()" [value]="d.id">{{ d.name }}</option>
              </select>
            </label>
            <label class="flex flex-col dark:text-white/90">
              <span class="mb-1">Prov</span>
              <select formControlName="provincia" class="input">
                <option value="" disabled selected>Provincia</option>
                <option *ngFor="let p of provincias()" [value]="p.id">{{ p.name }}</option>
              </select>
            </label>
            <label class="flex flex-col dark:text-white/90">
              <span class="mb-1">Dist</span>
              <select formControlName="distrito" class="input">
                <option value="" disabled selected>Distrito</option>
                <option *ngFor="let d of distritos()" [value]="d.id">{{ d.name }}</option>
              </select>
            </label>
          </div>

          <div class="flex justify-between gap-2 pt-2">
            <button
              mat-stroked-button
              matStepperPrevious
              class="!h-10 !rounded-xl !px-5 !normal-case !border-gray-300 !text-gray-700 hover:!bg-gray-50 dark:!border-white/10 dark:!text-gray-300 dark:hover:!bg-white/5"
            >
              Volver
            </button>

            <button
              mat-flat-button
              matStepperNext
              [disabled]="dirForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Siguiente
            </button>
          </div>
        </form>
      </mat-step>

      <!-- 3. Contacto -->
      <mat-step [stepControl]="contactoForm" label="Contacto">
        <form [formGroup]="contactoForm" class="space-y-4 py-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="flex flex-col dark:text-white/90">
              <span class="mb-1">Email</span>
              <input formControlName="email" class="input" />
            </label>
            <label class="flex flex-col dark:text-white/90">
              <span class="mb-1">Teléfono</span>
              <input formControlName="telefono" class="input" />
            </label>
          </div>

          <div class="flex justify-between gap-2 pt-2">
            <button
              mat-stroked-button
              matStepperPrevious
              class="!h-10 !rounded-xl !px-5 !normal-case !border-gray-300 !text-gray-700 hover:!bg-gray-50 dark:!border-white/10 dark:!text-gray-300 dark:hover:!bg-white/5"
            >
              Volver
            </button>

            <button
              mat-flat-button
              type="button"
              (click)="guardar()"
              [disabled]="contactoForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Guardar
            </button>
          </div>
        </form>
      </mat-step>
    </mat-horizontal-stepper>
  </mat-dialog-content>
</div>
