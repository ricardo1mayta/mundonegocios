<app-form-crud titulo="Cotizaciones">
  <!-- FILTROS ------------------------------------------------------------ -->
  <div filtros>
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!--?Buscador -->
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Buscador</label>
          <p-datepicker inputId="buscador" formControlName="buscador" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>

        <!--?Fecha hasta -->
        <div class="self-end flex flex-col">
          <label for="fechaHasta" class="sr-only">Hasta</label>
          <p-datepicker inputId="fechaHasta" formControlName="fechaHasta" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>
      </div>
    </app-form-filter>
  </div>

  <div class="rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list
      class="flex flex-col flex-auto p-4"
      etiquetaAgregar="Crear"
      (agregarClick)="crearPedido()"
      nombreExcel="Clientes API Keys"
      [configuracionExcel]="configuracionExcel"
    >
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="Codigo" propiedad="codigo" />

        <app-columna-tabla titulo="Tikect" propiedad="id">
          <ng-template let-id="valor"
            ><button class="text-red-600" (click)="viewPdf(id)">
              <i aria-label="Archivo PDF" class="pi pi-file-pdf"></i>
            </button>
            <button (click)="downloadPdf(id)"><i class="pi pi-download"></i></button></ng-template
          >
        </app-columna-tabla>

        <app-columna-tabla titulo="Fecha Crea" propiedad="fechaCrea">
          <ng-template let-fechaCrea="valor">
            {{ fechaCrea | date: "dd/MM/yyyy" }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Fecha Entrega" propiedad="fechaEntrega">
          <ng-template let-fechaCrea="valor">
            {{ fechaCrea | date: "dd/MM/yyyy" }}
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Apellido Cliente" propiedad="nombreCliente">
          <ng-template let-nombreCliente="valor">
            {{ nombreCliente | uppercase }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Doc Cliente" propiedad="docCliente" />
        <app-columna-tabla titulo="Direccion" propiedad="direccion" />
        <app-columna-tabla titulo="Total" propiedad="total" />

        <app-columna-tabla titulo="Status" propiedad="estado" />

        <app-columna-tabla titulo="Usuario Crea" propiedad="usuarioCrea" />

        <app-accion-tabla etiqueta="Ver" icono="visibility" (accion)="verCotizacion($event.datos)" />
        <app-accion-tabla etiqueta="Editar" icono="edit" (accion)="editarPedido($event.datos)" />
        <app-accion-tabla etiqueta="Generar Pedido" icono="delete" (accion)="generarPedido($event.datos)" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
