<app-form-crud titulo="Inventario general sede">
  <!-- FILTROS ------------------------------------------------------------ -->
  <div filtros>
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!--?Buscador -->
        <div class="sm:col-span-2 md:col-span-2 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Buscador</label>
          <div class="relative">
            <input
              id="buscador"
              type="text"
              placeholder="Buscar por código o nombre"
              formControlName="buscador"
              class="input pl-10"
              (keydown.enter)="aplicarFiltros()"
            />
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <!--   HeroIcon: magnifying-glass   -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-gray-400 dark:text-gray-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-4.35-4.35m0 0A7 7 0 1010 17.65l4.35 4.35z"
                />
              </svg>
            </span>
          </div>
        </div>

        <!--?Fecha desde -->
        <div class="flex flex-col">
          <label class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Sede</label>
          <select formControlName="fechaDesde" class="input">
            <option value="">Todas las sedes</option>
            <option *ngFor="let sede of sedes()" [value]="sede.id">{{ sede.nombresede }}</option>
          </select>
        </div>

        <!--?Fecha hasta -->
      </div>
    </app-form-filter>
  </div>
  <div class="p-1 rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list
      class="flex flex-col flex-auto p-4"
      etiquetaAgregar="Crear"
      nombreExcel="Clientes API Keys"
      [configuracionExcel]="configuracionExcel"
    >
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="Codigo" propiedad="codigo" />
        <app-columna-tabla titulo="Imagen" propiedad="imagen" tipo="imagen">
          <ng-template let-imagen="valor">
            <button (click)="verImagen(imagen)" class="p-0 border-0 bg-transparent focus:outline-none">
              <img
                *ngIf="imagen"
                [src]="imagen"
                alt="Imagen del producto"
                class="w-10 h-10 object-cover rounded-lg hover:opacity-80"
              />
            </button>
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Nombre" propiedad="nombreProducto" />
        <app-columna-tabla titulo="Marca" propiedad="marca" />
        <app-columna-tabla titulo="categoria" propiedad="categoria" />
        <app-columna-tabla titulo="Precio Venta" propiedad="precioventa" tipo="moneda">
          <ng-template let-precioventa="valor" let-elemento="elemento">
            <input
              type="number"
              [value]="precioventa"
              class="w-[70px] p-1 border rounded bg-white text-gray-800 dark:bg-gray-900 dark:text-white/90 dark:border-gray-700"
              (blur)="editar(elemento.id, 'precioventa', $event)"
            />
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Precio Oferta" propiedad="preciooferta" tipo="moneda">
          <ng-template let-preciooferta="valor" let-elemento="elemento">
            <input
              type="number"
              [value]="preciooferta"
              class="w-[70px] p-1 border rounded bg-white text-gray-800 dark:bg-gray-900 dark:text-white/90 dark:border-gray-700"
              (blur)="editar(elemento.id, 'preciooferta', $event)"
            />
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Precio Cliente" propiedad="preciocliente" tipo="moneda">
          <ng-template let-preciocliente="valor" let-elemento="elemento">
            <input
              type="number"
              [value]="preciocliente"
              class="w-[70px] p-1 border rounded bg-white text-gray-800 dark:bg-gray-900 dark:text-white/90 dark:border-gray-700"
              (blur)="editar(elemento.id, 'preciocliente', $event)"
            />
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Precio Mayorista" propiedad="preciomayor" tipo="moneda">
          <ng-template let-preciomayor="valor" let-elemento="elemento">
            <input
              type="number"
              [value]="preciomayor"
              class="w-[70px] p-1 border rounded bg-white text-gray-800 dark:bg-gray-900 dark:text-white/90 dark:border-gray-700"
              (blur)="editar(elemento.id, 'preciomayor', $event)"
            />
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Stock" propiedad="cantidad">
          <ng-template let-cantidad="valor" let-elemento="elemento">
            <!-- Botón que abre el modal -->
            <button color="primary" aria-label="Editar stock" (click)="abrirModalStock(elemento)">
              {{ cantidad }}
            </button>
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Precio Compra" propiedad="preciocompra" tipo="moneda" />

        <app-columna-tabla titulo="Web Venta" propiedad="statusweb">
          <ng-template let-statusweb="valor" let-elemento="elemento">
            <app-switch
              label=""
              [defaultChecked]="!!elemento.statusweb"
              (valueChange)="editarEstado(elemento.id, 'statusweb', $event)"
            ></app-switch>
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Web Oferta" propiedad="statusoff">
          <ng-template let-statusoff="valor" let-elemento="elemento">
            <app-switch
              label=""
              [defaultChecked]="!!elemento.statusoff"
              (valueChange)="editarEstado(elemento.id, 'statusoff', $event)"
            ></app-switch>
          </ng-template>
        </app-columna-tabla>
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
