<app-form-crud titulo="Categorias">
  <!-- FILTROS ------------------------------------------------------------ -->
  <div filtros class="text-gray-800 dark:text-white/90">
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!--?Buscador -->
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Buscador</label>
          <p-datepicker inputId="buscador" formControlName="buscador" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>

        <!--?Fecha hasta -->
        <div class="self-end flex flex-col">
          <label for="fechaHasta" class="sr-only">Hasta</label>
          <p-datepicker inputId="fechaHasta" formControlName="fechaHasta" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>
      </div>
    </app-form-filter>
  </div>
  <div class="p-1 rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list class="flex flex-col flex-auto p-4" etiquetaAgregar="Crear" (agregarClick)="crearMarca()" nombreExcel="Clientes API Keys" [configuracionExcel]="configuracionExcel">
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="Codigo" propiedad="codigo" />
        <app-columna-tabla titulo="Imagen" propiedad="image" tipo="imagen">
          <ng-template let-image="valor">
            <img *ngIf="image" [src]="image" alt="Imagen de la categoría" class="w-16 h-16 object-cover rounded-lg" />
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Nombre" propiedad="nombre" />
        <app-columna-tabla titulo="Desc. Web" propiedad="descripionweb" />
        <app-columna-tabla titulo="Slug" propiedad="slug" />
        <app-columna-tabla titulo="Estado" propiedad="statuscat">
          <ng-template let-statuscat="valor">
            <app-switch label="" [defaultChecked]="!!statuscat" [disabled]="true"></app-switch>
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Web" propiedad="stadoweb">
          <ng-template let-stadoweb="valor">
            <app-switch label="" [defaultChecked]="!!stadoweb" [disabled]="true"></app-switch>
          </ng-template>
        </app-columna-tabla>

        <app-accion-tabla etiqueta="Ver" icono="visibility" />
        <app-accion-tabla etiqueta="Editar" icono="edit" (accion)="editarMarca($event.datos)" />
        <app-accion-tabla etiqueta="Eliminar" icono="delete" (accion)="eliminarMarca($event.datos)" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
