<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden dark:bg-gray-900">
    <!-- Cabecera -->
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h2 class="text-xl font-bold text-gray-800 dark:text-white/90">
        {{ categoriaForm.get("id")?.value ? "Editar Categoría" : "Crear Categoría" }}
      </h2>
      <button type="button" (click)="onCerrar()" class="text-gray-400 hover:text-gray-600 transition dark:text-gray-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Formulario -->
    <form [formGroup]="categoriaForm" (ngSubmit)="guardarCategoria()" class="px-6 py-6 space-y-6">
      <!-- Nombre -->
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1 dark:text-white/90 dark:text-gray-200">Nombre de la Categoría</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Ej. Tablets, Smartphones"
          class="w-full border rounded-lg px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white/90"
          [class.border-red-500]="categoriaForm.get('nombre')?.invalid && categoriaForm.get('nombre')?.touched" />
        <div *ngIf="categoriaForm.get('nombre')?.invalid && categoriaForm.get('nombre')?.touched" class="text-sm text-red-500 mt-1">El nombre es obligatorio.</div>
      </div>

      <!-- Descripción Web -->
      <div>
        <label for="descripionweb" class="block text-sm font-medium text-gray-700 mb-1 dark:text-white/90 dark:text-gray-200">Descripción Web</label>
        <textarea
          id="descripionweb"
          formControlName="descripionweb"
          rows="3"
          placeholder="Descripción breve para mostrar en la web"
          class="w-full border rounded-lg px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white/90"></textarea>
      </div>
      <!-- Slug -->
      <div>
        <label for="slug" class="block text-sm font-medium text-gray-700 mb-1 dark:text-white/90 dark:text-gray-200">Slug</label>
        <input id="slug" type="text" formControlName="slug" placeholder="Ej. tablets" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <!-- Imagen -->
      <div>
        <label for="image" class="block text-sm font-medium text-gray-700 mb-1 dark:text-white/90 dark:text-gray-200">Imagen</label>
        <input
          id="image"
          type="file"
          (change)="onFileChange($event)"
          accept="image/*"
          class="block w-full text-sm text-gray-700 border border-gray-300 rounded-lg cursor-pointer bg-white file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 dark:text-gray-200" />

        <!-- Mostrar imagen previa si existe -->
        <div *ngIf="previewUrl || categoriaForm.get('image')?.value" class="mt-3">
          <img [src]="previewUrl || categoriaForm.get('image')?.value" alt="Vista previa" class="h-24 rounded-md border object-cover" />
        </div>
      </div>

      <!-- Estado y Mostrar en Web -->
      <div class="flex flex-col sm:flex-row gap-4">
        <!-- Estado (statuscat) -->
        <label class="flex items-center gap-3 cursor-pointer dark:text-white/90">
          <input type="checkbox" formControlName="statuscat" class="sr-only peer" />
          <div
            class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-green-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-full dark:bg-gray-700"></div>
          <span class="text-sm text-gray-700 dark:text-gray-300 dark:text-gray-200">Activo</span>
        </label>

        <!-- Mostrar en Web (stadoweb) -->
        <label class="flex items-center gap-3 cursor-pointer dark:text-white/90">
          <input type="checkbox" formControlName="stadoweb" class="sr-only peer" />
          <div
            class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-blue-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-full dark:bg-gray-700"></div>
          <span class="text-sm text-gray-700 dark:text-gray-300 dark:text-gray-200">Mostrar en Web</span>
        </label>
      </div>
    </form>

    <!-- Pie -->
    <div class="flex justify-end items-center gap-2 px-6 py-4 border-t bg-gray-50 dark:bg-gray-900">
      <button type="button" (click)="onCerrar()" class="px-5 py-3.5 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition dark:text-gray-400 dark:border-gray-700 dark:text-gray-300">Cancelar</button>
      <button type="submit" (click)="guardarCategoria()" class="px-5 py-3.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow">Guardar</button>
    </div>
  </div>
</div>
