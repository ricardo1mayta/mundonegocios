<div class="modal-surface">
  <button mat-icon-button mat-dialog-close class="hover:bg-blue-900/40 rounded-full p-1">
    <mat-icon>close</mat-icon>
  </button>
  <div class="px-2 pr-14 mb-6">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Sede</h2>
  </div>

  <!-- CUERPO -->
  <mat-dialog-content class="max-h-[80vh] overflow-y-auto p-0">
  <mat-horizontal-stepper #stepper linear>
    <!-- PASO 1 -->
    <mat-step [stepControl]="datosGeneralesForm" label="Datos generales">
      <form [formGroup]="datosGeneralesForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
        <!-- RUC -->
        <div>
          <label class="label dark:text-white/90">RUC</label>
          <input formControlName="ruc" maxlength="11" class="input md:max-w-[240px]" />
          <p *ngIf="datosGeneralesForm.get('ruc')?.invalid && datosGeneralesForm.get('ruc')?.touched" class="err">RUC válido requerido</p>
        </div>

        <!-- Tipo Doc -->
        <div>
          <label class="label dark:text-white/90">Tipo doc.</label>
          <select formControlName="tipoDoc" class="input md:max-w-[240px]">
            <option value="1">RUC</option>
            <option value="6">DNI</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Nombre Sede</label>
          <input formControlName="nombresede" class="input" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Nombre comercial</label>
          <input formControlName="nomComercial" class="input" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Razón social</label>
          <input formControlName="razonSocial" class="input" />
        </div>

        <div class="col-span-full flex justify-end gap-2 pt-2">
          <button
            mat-flat-button
            matStepperNext
            [disabled]="datosGeneralesForm.invalid"
            class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
          >
            Siguiente
          </button>
        </div>
      </form>
    </mat-step>

    <!-- PASO 2 -->
    <mat-step [stepControl]="direccionForm" label="Dirección">
      <form [formGroup]="direccionForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
        <!-- Dirección principal -->
        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Dirección principal</label>
          <input formControlName="direccion" class="input" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">Dirección secundaria</label>
          <input formControlName="direccion2" class="input" />
        </div>

        <div>
          <label class="label dark:text-white/90">Departamento</label>
          <input formControlName="direccionDepartamento" class="input" />
        </div>

        <div>
          <label class="label dark:text-white/90">Provincia</label>
          <input formControlName="direccionProvincia" class="input" />
        </div>

        <div>
          <label class="label dark:text-white/90">Distrito</label>
          <input formControlName="direccionDistrito" class="input" />
        </div>

        <div>
          <label class="label dark:text-white/90">Ubigeo</label>
          <input formControlName="codigoUbigeo" class="input" />
        </div>

        <div class="col-span-full flex justify-between gap-2 pt-2">
          <button
            mat-stroked-button
            matStepperPrevious
            class="!h-10 !rounded-xl !px-5 !normal-case !border-slate-300 !text-slate-700 hover:!bg-slate-50 dark:!border-white/10 dark:!text-slate-200 dark:hover:!bg-white/5"
          >
            Volver
          </button>
          <button
            mat-flat-button
            matStepperNext
            [disabled]="direccionForm.invalid"
            class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
          >
            Siguiente
          </button>
        </div>
      </form>
    </mat-step>

    <!-- PASO 3 -->
    <mat-step [stepControl]="contactoForm" label="Contacto & Web">
      <form [formGroup]="contactoForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 py-4">
        <div>
          <label class="label dark:text-white/90">Teléfono</label>
          <input formControlName="telefono" class="input md:max-w-[240px]" />
        </div>

        <div class="flex items-center gap-2">
          <input id="web" type="checkbox" formControlName="publicaenweb" class="h-5 w-5 accent-blue-600" />
          <label for="web" class="label select-none cursor-pointer dark:text-white/90">Publicar en web</label>
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">URL logo (impresión)</label>
          <input formControlName="logoImpresion" class="input" />
        </div>

        <div class="md:col-span-2">
          <label class="label dark:text-white/90">URL imagen (web)</label>
          <input formControlName="imagen" class="input" />
        </div>

        <div class="col-span-full flex justify-between gap-2 pt-2">
          <button
            mat-stroked-button
            matStepperPrevious
            class="!h-10 !rounded-xl !px-5 !normal-case !border-slate-300 !text-slate-700 hover:!bg-slate-50 dark:!border-white/10 dark:!text-slate-200 dark:hover:!bg-white/5"
          >
            Volver
          </button>
          <button
            mat-flat-button
            matStepperNext
            class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
          >
            Siguiente
          </button>
        </div>
      </form>
    </mat-step>

    <!-- PASO 4 -->
    <mat-step [stepControl]="textosForm" label="Textos">
      <form [formGroup]="textosForm" class="space-y-4 py-4">
        <div>
          <label class="label dark:text-white/90">Texto garantía</label>
          <textarea formControlName="textogarantia" rows="3" class="input"></textarea>
        </div>

        <div>
          <label class="label dark:text-white/90">Información adicional (info)</label>
          <textarea formControlName="info" rows="2" class="input"></textarea>
        </div>

        <div>
          <label class="label dark:text-white/90">Información adicional (info2)</label>
          <textarea formControlName="info2" rows="2" class="input"></textarea>
        </div>

        <div class="flex justify-between gap-2 pt-2">
          <button
            mat-stroked-button
            matStepperPrevious
            class="!h-10 !rounded-xl !px-5 !normal-case !border-slate-300 !text-slate-700 hover:!bg-slate-50 dark:!border-white/10 dark:!text-slate-200 dark:hover:!bg-white/5"
          >
            Volver
          </button>
          <button
            mat-flat-button
            (click)="guardar()"
            [disabled]="textosForm.invalid"
            class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
          >
            Guardar
          </button>
        </div>
      </form>
    </mat-step>
  </mat-horizontal-stepper>
  </mat-dialog-content>
</div>
