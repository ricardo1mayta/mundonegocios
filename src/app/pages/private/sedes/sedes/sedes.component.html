<app-form-crud titulo="Sedes">
  <!-- FILTROS -->
  <div filtros class="text-gray-800 dark:text-white/90">
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Buscador -->
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Buscador</label>
          <p-datepicker inputId="buscador" formControlName="buscador" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>

        <!-- Fecha hasta -->
        <div class="self-end flex flex-col">
          <label class="sr-only">Hasta</label>
          <p-datepicker formControlName="fechaHasta" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body" styleClass="prime-form-input"></p-datepicker>
        </div>
      </div>
    </app-form-filter>
  </div>

  <!-- LISTA -->
  <div class="p-1 rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list class="flex flex-col flex-auto p-4" etiquetaAgregar="Crear" (agregarClick)="crearSede()" nombreExcel="Sedes" [configuracionExcel]="configuracionExcel">
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="ID" propiedad="id" />
        <app-columna-tabla titulo="RUC" propiedad="ruc" />
        <app-columna-tabla titulo="Sede" propiedad="nombresede" />
        <app-columna-tabla titulo="Nombre Comercial" propiedad="nomComercial" />
        <app-columna-tabla titulo="Razón Social" propiedad="razonSocial" />
        <app-columna-tabla titulo="Teléfono" propiedad="telefono" />
        <app-columna-tabla titulo="Estado" propiedad="status">
          <ng-template let-status="valor">
            <app-switch label="" [defaultChecked]="status === '1'" [disabled]="true"></app-switch>
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Web" propiedad="publicaenweb">
          <ng-template let-web="valor">
            <app-switch label="" [defaultChecked]="!!web" [disabled]="true"></app-switch>
          </ng-template>
        </app-columna-tabla>

        <app-accion-tabla etiqueta="Duplicar" icono="content_copy" (accion)="duplicar($event.datos)" />
        <app-accion-tabla etiqueta="Editar" icono="edit" (accion)="editarSede($event.datos)" />
        <app-accion-tabla etiqueta="Eliminar" icono="delete" (accion)="eliminarSede($event.datos)" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
