<nav class="bg-gray-900 text-white px-4 py-2 shadow flex items-center justify-between">
  <!-- CENTRO: Barra de búsqueda -->
  <div class="flex-1 mx-4 hidden md:flex justify-center">
    <div class="relative w-full max-w-md">
      <input
        type="text"
        placeholder="Buscar o escribir comando..."
        class="w-full pl-10 pr-10 py-2 border border-blue-200 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 dark:text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
          />
        </svg>
      </div>
      <div class="absolute inset-y-0 right-0 flex items-center pr-3">
        <kbd class="text-xs text-gray-500 border px-1 py-0.5 rounded dark:text-gray-400">?K</kbd>
      </div>
    </div>
  </div>
  <button class="md:hidden p-2" (click)="toggleSidebar.emit()">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
  <!-- DERECHA: Avatar + menú -->
  <div class="flex items-center gap-4" (clickOutside)="menuAbierto = false">
    <!-- Wrapper relativo -->
    <div class="relative">
      <!-- Botón avatar / nombre -->
      <button type="button" class="flex items-center gap-2 focus:outline-none" (click)="toggleMenu()">
        <img [src]="" alt="Usuario" class="w-8 h-8 rounded-full border" />
        <span class="text-sm font-medium hidden sm:inline"></span>
        <svg class="w-4 h-4 ml-1 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Menú -->
      <div
        *ngIf="menuAbierto"
        class="absolute right-0 top-full mt-2 w-48 bg-white text-gray-900 rounded shadow-lg z-50 dark:bg-gray-900 dark:text-white/90"
      >
        <button (click)="cerrarSesion()" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2">
          <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4a2 2 0 11-4 0 2 2 0 014 0zM5.5 20h13
                   a2.5 2.5 0 002.5-2.5V6A2.5 2.5 0 0018.5 3H5.5
                   A2.5 2.5 0 003 5.5v13A2.5 2.5 0 005.5 21z"
            />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</nav>
