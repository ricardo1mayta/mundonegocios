<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <div class="flex min-h-screen">
    <!-- Sidebar fijo en desktop -->
    <app-sidebar
      class="hidden md:block w-72 shrink-0 border-r border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900"
    ></app-sidebar>

    <!-- Zona derecha: Navbar + página -->
    <div class="flex-1 flex flex-col">
      <!-- NAVBAR (alto fijo, ej. h-16) -->
      <app-navbar class="h-16 border-b border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900" (toggleSidebar)="sidebarAbierto = !sidebarAbierto"></app-navbar>

      <!-- Contenido scrollable -->
      <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <div class="mx-auto w-full max-w-(--breakpoint-2xl)">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

    <!-- Drawer móvil -->
    <app-sidebar
      *ngIf="sidebarAbierto"
      class="fixed inset-y-0 left-0 w-72 bg-white shadow-lg z-40 md:hidden transition-transform duration-200 dark:bg-gray-900"
    ></app-sidebar>

    <!-- Backdrop -->
    <div *ngIf="sidebarAbierto" class="fixed inset-0 bg-black/40 z-30 md:hidden" (click)="sidebarAbierto = false"></div>
  </div>
</div>
