<div
  class="modal-surface relative rounded-2xl bg-white dark:bg-gray-dark shadow-theme-lg border border-gray-200 dark:border-white/5 p-6 dark:bg-gray-900 dark:border-gray-800"
>
  <!-- Cerrar -->
  <button
    mat-icon-button
    mat-dialog-close
    class="!absolute !right-4 !top-4 !z-[9999] !rounded-lg hover:!bg-gray-100 dark:hover:!bg-white/5"
  >
    <mat-icon class="!text-gray-500 dark:!text-gray-400">close</mat-icon>
  </button>

  <!-- Header -->
  <div class="mb-6 pr-10">
    <h2 class="text-theme-xl font-semibold text-gray-900 dark:text-white/90">Cliente</h2>
    <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">Completa los datos del cliente en 3 pasos.</p>
  </div>

  <!-- Contenido -->
  <mat-dialog-content class="max-h-[75vh] overflow-y-auto custom-scrollbar p-0">
    <mat-horizontal-stepper linear class="bg-transparent">
      <!-- Paso 1 -->
      <mat-step [stepControl]="docForm" label="Documento">
        <form [formGroup]="docForm" class="pt-4 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
            <label class="flex flex-col gap-1 md:col-span-2 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Tipo documento</span>
              <select
                formControlName="clienteTipodocumento"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
              >
                <option *ngFor="let t of tiposDocumento()" [value]="t.id">{{ t.desc }}</option>
              </select>
            </label>

            <label class="flex flex-col gap-1 md:col-span-2 relative dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Nº Documento *</span>

              <input
                formControlName="clienteNumerodocumento"
                class="input !h-11 !rounded-xl !border-gray-300 pr-12 dark:!border-white/10 dark:!bg-gray-900/40"
                (keydown.enter)="buscarEnSunat()"
                placeholder="Ingrese el número"
              />

              <button
                type="button"
                (click)="buscarEnSunat()"
                class="absolute right-2 top-[30px] h-9 w-9 inline-flex items-center justify-center rounded-lg border border-gray-200 bg-gray-50 hover:bg-gray-100 dark:border-white/10 dark:bg-white/5 dark:hover:bg-white/10 dark:bg-gray-900 dark:border-gray-800"
                matTooltip="Buscar en SUNAT"
              >
                <mat-icon class="!text-gray-600 dark:!text-gray-300">search</mat-icon>
              </button>
            </label>

            <label class="flex flex-col gap-1 md:col-span-2 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Nombre / RS *</span>
              <input
                formControlName="clienteNombre"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
                placeholder="Nombre o razón social"
              />
            </label>
          </div>

          <!-- Acciones -->
          <div class="flex justify-end gap-2 pt-2">
            <button
              mat-flat-button
              matStepperNext
              [disabled]="docForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Siguiente
            </button>
          </div>
        </form>
      </mat-step>

      <!-- Paso 2 -->
      <mat-step [stepControl]="dirForm" label="Dirección">
        <form [formGroup]="dirForm" class="pt-4 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <label class="flex flex-col gap-1 md:col-span-2 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Ciudad</span>
              <input
                formControlName="clienteCiudad"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
                placeholder="Ciudad"
              />
            </label>

            <label class="flex flex-col gap-1 md:col-span-3 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Dirección *</span>
              <input
                formControlName="clienteDireccion"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
                placeholder="Av / Jr / Calle, N°..."
              />
            </label>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <label class="flex flex-col gap-1 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Dpto</span>
              <select
                formControlName="clienteDepartamento"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
              >
                <option value="" disabled>Departamento</option>
                <option *ngFor="let d of departamentos()" [value]="d.id">{{ d.name }}</option>
              </select>
            </label>

            <label class="flex flex-col gap-1 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Prov</span>
              <select
                formControlName="clienteProvincia"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
              >
                <option value="" disabled>Provincia</option>
                <option *ngFor="let p of provincias()" [value]="p.id">{{ p.name }}</option>
              </select>
            </label>

            <label class="flex flex-col gap-1 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Dist</span>
              <select
                formControlName="clienteDistrito"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
              >
                <option value="" disabled>Distrito</option>
                <option *ngFor="let d of distritos()" [value]="d.id">{{ d.name }}</option>
              </select>
            </label>
          </div>

          <!-- Acciones -->
          <div class="flex justify-between gap-2 pt-2">
            <button
              mat-stroked-button
              matStepperPrevious
              class="!h-10 !rounded-xl !px-5 !normal-case !border-gray-300 !text-gray-700 hover:!bg-gray-50 dark:!border-white/10 dark:!text-gray-300 dark:hover:!bg-white/5"
            >
              Volver
            </button>

            <button
              mat-flat-button
              matStepperNext
              [disabled]="dirForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Siguiente
            </button>
          </div>
        </form>
      </mat-step>

      <!-- Paso 3 -->
      <mat-step [stepControl]="contactoForm" label="Contacto">
        <form [formGroup]="contactoForm" class="pt-4 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="flex flex-col gap-1 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Email</span>
              <input
                formControlName="clienteEmail"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
                placeholder="correo@dominio.com"
              />
            </label>

            <label class="flex flex-col gap-1 dark:text-white/90">
              <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-200">Teléfono</span>
              <input
                formControlName="clienteTelefono"
                class="input !h-11 !rounded-xl !border-gray-300 dark:!border-white/10 dark:!bg-gray-900/40"
                placeholder="999 999 999"
              />
            </label>
          </div>

          <!-- Acciones -->
          <div class="flex justify-between gap-2 pt-2">
            <button
              mat-stroked-button
              matStepperPrevious
              class="!h-10 !rounded-xl !px-5 !normal-case !border-gray-300 !text-gray-700 hover:!bg-gray-50 dark:!border-white/10 dark:!text-gray-300 dark:hover:!bg-white/5"
            >
              Volver
            </button>

            <button
              mat-flat-button
              type="button"
              (click)="guardar()"
              [disabled]="contactoForm.invalid"
              class="!h-10 !rounded-xl !px-5 !normal-case !bg-slate-900 hover:!bg-slate-800 !text-white disabled:!bg-slate-400 !shadow-theme-xs dark:!bg-slate-200 dark:!text-slate-900 dark:hover:!bg-white"
            >
              Guardar
            </button>
          </div>
        </form>
      </mat-step>
    </mat-horizontal-stepper>
  </mat-dialog-content>
</div>
