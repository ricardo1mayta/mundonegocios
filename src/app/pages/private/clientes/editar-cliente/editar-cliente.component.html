<div class="modal-surface">
  <button mat-icon-button mat-dialog-close class="modal-close">
    <mat-icon>close</mat-icon>
  </button>
  <div class="px-2 pr-14 mb-6">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Cliente</h2>
  </div>

  <!-- STEPPER -->
  <mat-dialog-content class="max-h-[85vh] overflow-y-auto p-0">
  <mat-horizontal-stepper linear>
    <!-- Paso 1 -->
    <mat-step [stepControl]="docForm" label="Documento">
      <form [formGroup]="docForm" class="space-y-4 py-4">
        <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
          <label class="flex flex-col md:col-span-2">
            <span class="mb-1">Tipo documento</span>
            <select formControlName="clienteTipodocumento" class="input">
              <option *ngFor="let t of tiposDocumento()" [value]="t.id">{{ t.desc }}</option>
            </select>
          </label>

          <label class="flex flex-col md:col-span-2 relative">
            <span class="mb-1">Nº Documento*</span>
            <input formControlName="clienteNumerodocumento" class="input pr-10" (keydown.enter)="buscarEnSunat()" />
            <button type="button" (click)="buscarEnSunat()" class="absolute right-2 top-7 text-blue-600 hover:text-blue-800">
              <mat-icon>search</mat-icon>
            </button>
          </label>

          <label class="flex flex-col md:col-span-2">
            <span class="mb-1">Nombre / RS *</span>
            <input formControlName="clienteNombre" class="input" />
          </label>
        </div>

        <div class="flex justify-end pt-4">
          <button mat-button matStepperNext [disabled]="docForm.invalid">Siguiente</button>
        </div>
      </form>
    </mat-step>

    <!-- Paso 2 -->
    <mat-step [stepControl]="dirForm" label="Dirección">
      <form [formGroup]="dirForm" class="space-y-4 py-4">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
          <label class="flex flex-col md:col-span-2">
            <span class="mb-1">Ciudad</span>
            <input formControlName="clienteCiudad" class="input" />
          </label>
          <label class="flex flex-col md:col-span-3">
            <span class="mb-1">Dirección *</span>
            <input formControlName="clienteDireccion" class="input" />
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <label class="flex flex-col">
            <span class="mb-1">Dpto</span>
            <select formControlName="clienteDepartamento" class="input">
              <option value="" disabled selected>Departamento</option>
              <option *ngFor="let d of departamentos()" [value]="d.id">{{ d.name }}</option>
            </select>
          </label>
          <label class="flex flex-col">
            <span class="mb-1">Prov</span>
            <select formControlName="clienteProvincia" class="input">
              <option value="" disabled selected>Provincia</option>
              <option *ngFor="let p of provincias()" [value]="p.id">{{ p.name }}</option>
            </select>
          </label>
          <label class="flex flex-col">
            <span class="mb-1">Dist</span>
            <select formControlName="clienteDistrito" class="input">
              <option value="" disabled selected>Distrito</option>
              <option *ngFor="let d of distritos()" [value]="d.id">{{ d.name }}</option>
            </select>
          </label>
        </div>

        <div class="flex justify-between pt-4">
          <button mat-button matStepperPrevious>Volver</button>
          <button mat-button matStepperNext [disabled]="dirForm.invalid">Siguiente</button>
        </div>
      </form>
    </mat-step>

    <!-- Paso 3 -->
    <mat-step [stepControl]="contactoForm" label="Contacto">
      <form [formGroup]="contactoForm" class="space-y-4 py-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="flex flex-col">
            <span class="mb-1">Email</span>
            <input formControlName="clienteEmail" class="input" />
          </label>
          <label class="flex flex-col">
            <span class="mb-1">Teléfono</span>
            <input formControlName="clienteTelefono" class="input" />
          </label>
        </div>

        <div class="flex justify-between pt-4">
          <button mat-button matStepperPrevious>Volver</button>
          <button mat-flat-button class="inline-flex items-center justify-center gap-2 rounded-lg transition px-5 py-3.5 text-sm bg-brand-500 text-white shadow-theme-xs hover:bg-brand-600 disabled:bg-brand-300" (click)="guardar()" [disabled]="contactoForm.invalid">Guardar</button>
        </div>
      </form>
    </mat-step>
  </mat-horizontal-stepper>
  </mat-dialog-content>
</div>
