<app-form-crud titulo="Lista de Fichas Técnicas">
  <!-- FILTROS ------------------------------------------------------------ -->
  <div filtros class="text-gray-800 dark:text-white/90">
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Buscador -->
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Buscador</label>
          <div class="relative">
            <input
              id="buscador"
              type="text"
              placeholder="Buscar por código o nombre"
              formControlName="buscador"
              class="input pl-10"
              (keydown.enter)="aplicarFiltros()" />
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <!--   HeroIcon: magnifying-glass   -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7 7 0 1010 17.65l4.35 4.35z" />
              </svg>
            </span>
          </div>
        </div>

        <!-- Fecha desde -->
        <div class="flex flex-col">
          <label for="fechaDesde" class="text-md font-medium mt-4 mb-1 text-gray-800 dark:text-white/90">Fecha de creación (Desde)</label>
          <div class="relative">
            <input
              id="fechaDesde"
              matInput
              [matDatepicker]="fechaDesdePicker"
              formControlName="fechaDesde"
              [max]="filtroForm.get('fechaHasta')?.value"
              class="input pr-10"
              (click)="fechaDesdePicker.open()" />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400"
              (click)="fechaDesdePicker.open()"
            >
              <mat-icon class="!text-[18px]">calendar_today</mat-icon>
            </button>
            <mat-datepicker #fechaDesdePicker></mat-datepicker>
          </div>
        </div>

        <!-- Fecha hasta -->
        <div class="self-end flex flex-col">
          <label for="fechaHasta" class="sr-only">Hasta</label>
          <div class="relative">
            <input
              id="fechaHasta"
              matInput
              [matDatepicker]="fechaHastaPicker"
              formControlName="fechaHasta"
              [min]="filtroForm.get('fechaDesde')?.value"
              class="input pr-10"
              (click)="fechaHastaPicker.open()" />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400"
              (click)="fechaHastaPicker.open()"
            >
              <mat-icon class="!text-[18px]">calendar_today</mat-icon>
            </button>
            <mat-datepicker #fechaHastaPicker></mat-datepicker>
          </div>
        </div>
      </div>
    </app-form-filter>
  </div>
  <div class="rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list class="flex flex-col flex-auto p-4" etiquetaAgregar="Crear" (agregarClick)="crearPedido()" nombreExcel="Clientes API Keys" [configuracionExcel]="configuracionExcel">
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtros()">
        <app-columna-tabla titulo="Codigo" propiedad="id" />
        <app-columna-tabla titulo="Fecha Crea" propiedad="fecha">
          <ng-template let-fecha="valor">
            {{ fecha | date: "dd/MM/yyyy" }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Nombre Ficha" propiedad="nombreFicha">
          <ng-template let-nombreFicha="valor">
            {{ nombreFicha | uppercase }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Nombre Plantilla" propiedad="nombre">
          <ng-template let-nombre="valor">
            {{ nombre | uppercase }}
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Nombre Plantilla" propiedad="total">
          <ng-template let-total="valor">
            {{ total | number: "1.0-6" }}
          </ng-template>
        </app-columna-tabla>

        <app-accion-tabla (accion)="editarCompra($event.datos)" etiqueta="Editar" icono="edit" />
        <app-accion-tabla (accion)="registrarProducto($event.datos)" etiqueta="Convertir en producto" icono="save" />
        <app-accion-tabla (accion)="cotizarProducto($event.datos)" etiqueta="Cotizar compra" icono="save" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
