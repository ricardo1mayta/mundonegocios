<app-form-crud titulo="Ordenes de Pedidos">
  <div filtros>
    <app-form-filter [formGroup]="filtroForm" [(filtros)]="filtros" [mostrarEstado]="false">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div class="sm:col-span-2 md:col-span-1 flex flex-col">
          <label for="buscador" class="text-md font-medium mt-4 mb-1 dark:text-white/90">Buscador</label>
          <div class="relative">
            <input
              id="buscador"
              type="text"
              placeholder="Buscar por codigo o nombre"
              formControlName="buscador"
              class="input pl-10"
              (keydown.enter)="aplicarFiltros()"
            />
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-gray-400 dark:text-gray-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-4.35-4.35m0 0A7 7 0 1010 17.65l4.35 4.35z"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="flex flex-col">
          <label for="fechaDesde" class="text-md font-medium mt-4 mb-1 dark:text-white/90">Fecha Desde</label>
          <div class="relative">
            <input
              id="fechaDesde"
              matInput
              [matDatepicker]="fechaDesdePicker"
              formControlName="fechaDesde"
              [max]="filtroForm.get('fechaHasta')?.value"
              placeholder="dd/MM/yyyy"
              autocomplete="off"
              class="input pr-10"
              (click)="fechaDesdePicker.open()"
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400"
              (click)="fechaDesdePicker.open()"
            >
              <mat-icon class="!text-[18px]">calendar_today</mat-icon>
            </button>
            <mat-datepicker #fechaDesdePicker></mat-datepicker>
          </div>
        </div>

        <div class="self-end flex flex-col">
          <label for="fechaHasta" class="sr-only">Hasta</label>
          <div class="relative">
            <input
              id="fechaHasta"
              matInput
              [matDatepicker]="fechaHastaPicker"
              formControlName="fechaHasta"
              [min]="filtroForm.get('fechaDesde')?.value"
              placeholder="dd/MM/yyyy"
              autocomplete="off"
              class="input pr-10"
              (click)="fechaHastaPicker.open()"
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400"
              (click)="fechaHastaPicker.open()"
            >
              <mat-icon class="!text-[18px]">calendar_today</mat-icon>
            </button>
            <mat-datepicker #fechaHastaPicker></mat-datepicker>
          </div>
        </div>
      </div>
    </app-form-filter>
  </div>

  <div class="rounded-lg bg-neutral-100 dark:bg-gray-900">
    <app-form-list
      class="flex flex-col flex-auto p-4"
      etiquetaAgregar="Crear"
      (agregarClick)="crearPedido()"
      nombreExcel="PEDIDOS"
      [configuracionExcel]="configuracionExcel"
    >
      <app-data-table [urlApi]="urlApi()" [parametrosApi]="filtrosApi()" [urlExcel]="urlApiReporte()">
        <app-columna-tabla titulo="Codigo" propiedad="codigo" />

        <app-columna-tabla titulo="Tikect" propiedad="id">
          <ng-template let-id="valor"
            ><button class="text-red-600" (click)="viewPdf(id)">
              <mat-icon aria-label="Archivo PDF">picture_as_pdf</mat-icon>
            </button>
            <button (click)="downloadPdf(id)"><mat-icon>cloud_download</mat-icon></button></ng-template
          >
        </app-columna-tabla>

        <app-columna-tabla titulo="Origen" propiedad="origen" />

        <app-columna-tabla titulo="Fecha Crea" propiedad="fechaCrea">
          <ng-template let-fechaCrea="valor">
            {{ fechaCrea | date: "dd/MM/yyyy" }}
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Fecha Entrega" propiedad="fechaEntrega">
          <ng-template let-fechaCrea="valor">
            {{ fechaCrea | date: "dd/MM/yyyy" }}
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Apellido Cliente" propiedad="nombreCliente" clase="px-4 py-2 text-center text-sm text-gray-800 dark:text-gray-100 min-w-[120px]">
          <ng-template let-nombreCliente="valor">
            {{ nombreCliente | uppercase }}
          </ng-template>
        </app-columna-tabla>

        <app-columna-tabla titulo="Doc Cliente" propiedad="docCliente" />
        <app-columna-tabla titulo="Direccion" propiedad="direccion" clase="px-4 py-2 text-center text-sm text-gray-800 dark:text-gray-100 min-w-[120px]" />
        <app-columna-tabla titulo="Total" propiedad="total" />
        <app-columna-tabla titulo="Status" propiedad="estado" />
        <app-columna-tabla titulo="Pago" propiedad="estadoPago" />
                <app-columna-tabla titulo="Registro" propiedad="estadoPedido" />
        <app-columna-tabla titulo="Comprobante FE" propiedad="comprobanteFe">
          <ng-template let-elemento="elemento">
            <div *ngIf="elemento?.idDocumentoElectronico; else sinFe" class="flex flex-col items-center gap-1">
              <span class="px-2 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                {{ elemento?.tipoComprobanteEmitido || "EMITIDO" }}
              </span>
              <span class="text-xs text-slate-500">{{ elemento?.serie }}</span>
              <span class="text-xs text-slate-400">ID FE: {{ elemento?.idDocumentoElectronico }}</span>
            </div>
            <ng-template #sinFe>-</ng-template>
          </ng-template>
        </app-columna-tabla>
        <app-columna-tabla titulo="Usuario Crea" propiedad="usuarioCrea" />

        <app-accion-tabla etiqueta="Ver" icono="visibility" (accion)="verPedido($event.datos)" />
        <app-accion-tabla etiqueta="Emitir FE" icono="request_quote" (accion)="emitirFacturacion($event.datos)" />
        <app-accion-tabla etiqueta="IMEIs" icono="qr_code_2" (accion)="registrarImeis($event.datos)" />
        <app-accion-tabla etiqueta="Guia" icono="local_shipping" (accion)="generarGuia($event.datos)" />
        <app-accion-tabla etiqueta="Editar" icono="edit" (accion)="editarPedido($event.datos)" />
        <app-accion-tabla etiqueta="Anular" icono="settings" (accion)="anularPedido($event.datos)" />
      </app-data-table>
    </app-form-list>
  </div>
</app-form-crud>
