<p-dialog
  [visible]="isOpen"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="showCloseButton"
  [dismissableMask]="!isFullscreen"
  [draggable]="false"
  [resizable]="false"
  [style]="dialogStyle"
  [styleClass]="dialogStyleClass"
>
  <ng-content></ng-content>
</p-dialog>
