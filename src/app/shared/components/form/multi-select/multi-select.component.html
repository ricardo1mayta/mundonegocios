<div class="w-full">
  @if (label) {
    <label class="prime-form-label">{{ label }}</label>
  }
  <p-multiselect
    [options]="options"
    optionLabel="text"
    optionValue="value"
    placeholder="Select option"
    display="chip"
    [disabled]="disabled"
    [ngModel]="selectedOptions"
    (ngModelChange)="onChange($event)"
    styleClass="prime-form-input"
  ></p-multiselect>
</div>
