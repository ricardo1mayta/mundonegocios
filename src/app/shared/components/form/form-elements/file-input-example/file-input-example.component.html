<app-component-card title="File Input">
  <div>
    <app-label>Subir archivo</app-label>
    <app-file-input
      (change)="handleFileChange($event)"
      className="file:font-medium file:bg-brand-500 file:text-white hover:file:bg-brand-600"
    ></app-file-input>
    <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">
      Formatos permitidos: PNG, JPG, PDF. Tamaño máximo recomendado: 5MB.
    </p>
  </div>
</app-component-card>
